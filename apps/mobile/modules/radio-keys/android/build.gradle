apply plugin: 'com.android.library'

group = 'za.co.ethekwini.radiokeys'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "za.co.ethekwini.radiokeys"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native itself: the background task that keeps timers running (keepJsRunning).
  implementation 'com.facebook.react:react-android'
}
